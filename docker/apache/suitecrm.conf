# SuiteCRM 8.9.3 - Apache Virtual Host
# NOTE: Rewrite rules intentionally left to public/.htaccess.
# In <VirtualHost> context, %{REQUEST_FILENAME} is URL-path;
# static-asset checks fail. Symfony's bundled .htaccess is already correct.
<VirtualHost *:80>
    ServerName crm.extendresourcing.com
    ServerAlias suitecrm.local localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy strict-origin-when-cross-origin
    </IfModule>

    ErrorLog  /var/log/apache2/suitecrm_error.log
    CustomLog /var/log/apache2/suitecrm_access.log combined
</VirtualHost>
